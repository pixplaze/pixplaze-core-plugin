# Регистрация в Pixplaze: впишите код заявки в motd в server.properties и перезапустите сервер.
# После регистрации код из MOTD можно убрать — сервер подключается сам, секреты лежат в credentials.json
pixplaze:
  # Адрес Pixplaze web-api
  gateway: https://api.pixplaze.net

# Как сервер видят снаружи. Заполнять, только если сервер за NAT или прокси и Pixplaze подсказал это сделать
api:
  # Игровой адрес (mc.server.net:50010). Пусто — адрес из заявки и из входов игроков
  host: ""
  # Адрес веб-карты (mc.server.net:50011). Пусто — карты нет
  map: ""
  # Адрес API плагина (mc.server.net:50012). Пусто — адрес сервера + http.port
  api: ""

# Где слушает API плагина
http:
  # Интерфейс: auto — все
  ip: auto
  port: 25566

# Обязательный вход в Pixplaze: пока игрок не подтвердит вход, он не может двигаться, ломать блоки и писать в чат
authorization:
  # На сервере без проверки аккаунтов Mojang (offline-mode или за прокси) всегда true
  enabled: false
  # Сколько минут игрок может оставаться без входа, потом кик; 0 — без кика
  timeout-minutes: 5
  # Сразу начинать вход, когда игрок без входа заходит на сервер: ссылка для подтверждения приходит в чат.
  # false — игрок вводит /pixplaze login сам
  auto-login: true

cors:
  "localhost"
