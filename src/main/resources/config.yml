access-token: "YourToken"
http-listen-port: 25566
http-listen-ip: auto

# Публичный хост, по которому игроки подключаются (например play.example.com).
# - Прямые серверы и BungeeCord: можно оставить пустым — хост определится
#   автоматически по адресам из подключений игроков (самый частый домен).
# - За Velocity или прокси без IP-forwarding автоопределение невозможно —
#   задайте хост здесь явно.
server-host: ""

cors:
  "localhost"
